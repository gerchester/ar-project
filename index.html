    <script>
       
        document.addEventListener('DOMContentLoaded', () => {
            const status = document.getElementById('status');
            const scene = document.querySelector('a-scene');

            let hammerManager = null;
            let currentDetachedModel = null;
            let originalMarkerParent = null;

            // Initialize gesture controls
            function initGestures(model) {
                const container = document.getElementById('ar-container');

                if (hammerManager) hammerManager.destroy();
                hammerManager = new Hammer.Manager(container);

                const pan = new Hammer.Pan({ direction: Hammer.DIRECTION_ALL, pointers: 1 });
                const pinch = new Hammer.Pinch();
                const twoFingerPan = new Hammer.Pan({ event: 'twofingerpan', pointers: 2, threshold: 0 });

                hammerManager.add([pan, pinch, twoFingerPan]);
                pinch.recognizeWith(twoFingerPan);
                twoFingerPan.recognizeWith(pinch);

                let initialScale = 1;

                hammerManager.on('pan', (e) => {
                    const rotation = model.getAttribute('rotation');
                    model.setAttribute('rotation', {
                        x: rotation.x + e.deltaY * 0.05,
                        y: rotation.y + e.deltaX * 0.05,
                        z: rotation.z,
                    });
                });

                hammerManager.on('pinchstart', (e) => (initialScale = e.scale));

                hammerManager.on('pinchmove', (e) => {
                    const scale = model.getAttribute('scale');
                    const factor = e.scale / initialScale;
                    model.setAttribute('scale', {
                        x: scale.x * factor,
                        y: scale.y * factor,
                        z: scale.z * factor,
                    });
                    initialScale = e.scale;
                });

                hammerManager.on('twofingerpan', (e) => {
                    const pos = model.getAttribute('position');
                    model.setAttribute('position', {
                        x: pos.x + e.deltaX / 50,
                        y: pos.y - e.deltaY / 50,
                        z: pos.z,
                    });
                });

                console.log("🎮 Gesture controls ready");
            }

         // Добавляем флаг, чтобы не пытаться детачить одновременно дважды
let isDetaching = false;

function detachModel(marker) {
  if (isDetaching) {
    console.log('⚠️ Detach already in progress, skipping');
    return;
  }
  isDetaching = true;

  console.log('=== DETACH START ===');
  const container = marker.querySelector('a-entity[id^="model-container"]');
  if (!container) {
    console.warn('❌ Model container not found');
    isDetaching = false;
    return;
  }

  const gltf = container.querySelector('a-gltf-model');
  if (!gltf) {
    console.warn('❌ No a-gltf-model inside container');
    isDetaching = false;
    return;
  }

  // Надёжный способ проверить загрузку: если object3D пустой — ждём model-loaded
  const modelReady = gltf.object3D && gltf.object3D.children.length > 0;
  if (!modelReady) {
    console.log('⏳ Waiting for model-loaded event before detach');
    const once = () => {
      gltf.removeEventListener('model-loaded', once);
      // маленькая задержка чтобы дать компонентам инициализироваться
      setTimeout(() => performDetach(marker, container, gltf), 80);
    };
    gltf.addEventListener('model-loaded', once);
    return;
  }

  // Если модель уже готова — делаем detach
  performDetach(marker, container, gltf);
}

async function performDetach(marker, container, gltfEl) {
  try {
    // 1) Получаем мировые трансформации
    container.object3D.updateMatrixWorld(true);
    const worldPos = new THREE.Vector3();
    const worldQuat = new THREE.Quaternion();
    const worldScale = new THREE.Vector3();
    container.object3D.getWorldPosition(worldPos);
    container.object3D.getWorldQuaternion(worldQuat);
    container.object3D.getWorldScale(worldScale);

    // 2) Получаем настройки из оригинальной модели
    const src = gltfEl.getAttribute('src');
    const originalAnimAttr = gltfEl.getAttribute('animation-mixer');
    
    if (!src) {
      console.warn('❌ Не найден src у a-gltf-model');
      return;
    }

    // 3) Скрываем оригинальную модель
    gltfEl.setAttribute('visible', 'false');

    // 4) Создаём новую сущность
    const detached = document.createElement('a-entity');
    detached.setAttribute('gltf-model', src);
    
    // Используем оригинальные настройки анимации
    if (originalAnimAttr) {
      detached.setAttribute('animation-mixer', originalAnimAttr);
    } else {
      detached.setAttribute('animation-mixer', 'clip: *; loop: repeat');
    }

    scene.appendChild(detached);

    // Обработчик успешной загрузки
    const onModelLoaded = (ev) => {
      detached.removeEventListener('model-loaded', onModelLoaded);
      
      // Устанавливаем трансформации
      detached.object3D.position.copy(worldPos);
      detached.object3D.quaternion.copy(worldQuat);
      detached.object3D.scale.set(50, 50, 50);
      detached.object3D.matrixAutoUpdate = true;

      // Сохраняем ссылки
      currentDetachedModel = detached;
      originalMarkerParent = marker;
      
      // Инициализируем жесты
      initGestures(detached);

      console.log('✅ Detached entity created successfully');
      status.textContent = 'Model detached — gestures active';

      // Анимация должна работать автоматически через animation-mixer
    };

    // Обработчик ошибки
    const onModelError = (err) => {
      detached.removeEventListener('model-error', onModelError);
      console.error('❌ Detached model load error', err);
      scene.removeChild(detached);
    };

    detached.addEventListener('model-loaded', onModelLoaded);
    detached.addEventListener('model-error', onModelError);

  } catch (err) {
    console.error('❌ performDetach error:', err);
  } finally {
    isDetaching = false;
  }
}

function restartAnimation(gltf) {
  try {
    const animCmp = gltf.components && gltf.components['animation-mixer'];
    if (!animCmp || !animCmp.mixer) {
      console.warn('⚠️ animation-mixer component / mixer not found; nothing to restart');
      return;
    }

    // Даем чуть времени на "передышку", затем перезапускаем actions
    setTimeout(() => {
      const actions = animCmp.mixer._actions || [];
      console.log(`🎬 Found ${actions.length} animation actions`);
      actions.forEach((action, i) => {
        try {
          action.reset();
          action.play();
          console.log(`▶️ Restarted action ${i}`, action._clip && action._clip.name);
        } catch (e) { console.warn('action restart fail', e); }
      });
      // Если нужно, можно вручную вызвать update с небольшим dt, но обычно play() достаточно
    }, 120);
  } catch (err) {
    console.error('❌ restartAnimation error:', err);
  }
}

function reattachModel() {
  if (!currentDetachedModel || !originalMarkerParent) {
    console.warn('❌ Nothing to reattach');
    return;
  }

  try {
    // Удаляем detached entity
    if (currentDetachedModel.parentElement === scene) {
      scene.removeChild(currentDetachedModel);
    }

    // Показываем оригинальную модель
    const originalGltf = originalMarkerParent.querySelector('a-gltf-model');
    if (originalGltf) {
      originalGltf.setAttribute('visible', 'true');
    }

    console.log('✅ Model reattached successfully');
    
  } catch (error) {
    console.error('❌ Error during reattach:', error);
  } finally {
    currentDetachedModel = null;
    originalMarkerParent = null;
    status.textContent = 'Model reattached to marker';
  }
}
            // Обработчик для маркеров
            function setupMarkerHandlers() {
                const markers = document.querySelectorAll('[mindar-image-target]');

                markers.forEach((marker, index) => {
                    marker.addEventListener('targetFound', () => {
                        console.log(`📍 Marker ${index} found`);
                        status.textContent = `Marker ${index} detected`;

                        // Если уже есть отсоединенная модель, игнорируем новый маркер
                        if (currentDetachedModel) return;

                        setTimeout(() => {
                            detachModel(marker);
                        }, 300);
                    });

                    marker.addEventListener('targetLost', () => {
                        console.log(`❌ Marker ${index} lost`);
                        
                        // Если это маркер с отсоединенной моделью
                        if (marker === originalMarkerParent && currentDetachedModel) {
                            status.textContent = 'Marker lost — model stays in place';
                        } else {
                            status.textContent = 'Marker lost';
                        }
                    });
                });
            }

            // Start AR - ИСПРАВЛЕННАЯ ВЕРСИЯ
            async function startAR() {
                try {
                    status.textContent = 'Requesting camera permission...';
                    
                    // ЗАПРАШИВАЕМ РАЗРЕШЕНИЕ НА КАМЕРУ
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { 
                            facingMode: 'environment' // Используем заднюю камеру на мобильных
                        } 
                    });
                    
                    // Останавливаем поток, так как MindAR будет использовать свою собственную инициализацию камеры
                    stream.getTracks().forEach(track => track.stop());
                    
                    status.textContent = 'Camera access granted. Starting AR...';

                    const arSystem = scene.systems["mindar-image-system"];

                    scene.addEventListener('arReady', () => {
                        status.textContent = 'Point camera at marker';
                    });

                    // Запускаем AR систему
                    arSystem.start();
                    console.log("✅ AR system started");
                    
                } catch (err) {
                    console.error('Camera error:', err);
                    status.textContent = 'Camera access denied. Please allow camera access.';
                }
            }

            // Start when scene is loaded
            scene.addEventListener('loaded', () => {
                setupMarkerHandlers();
                setTimeout(startAR, 1000);
            });

            // Добавляем кнопку для возврата модели
            document.addEventListener('keydown', (e) => {
                if (e.key === 'r' || e.key === 'R') {
                    reattachModel();
                }
            });
        });
    </script>
