<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR with Rotation Controls</title>
    <script src="./aframe.min.js"></script>
    <script src="./mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    <script src="./hammer.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        
        #ar-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .status {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            background: rgba(0, 0, 0, 0.3);
            padding: 5px 5px;
            border-radius: 20px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            z-index: 100;
            pointer-events: none;
            max-width: 80%;
            text-align: center;
        }
        
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            z-index: 15;
            text-align: center;
            font-family: Arial, sans-serif;
            font-size: 16px;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
        }
        
        .marker-info {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            background: rgba(0, 0, 0, 0.0);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 100;
            text-align: center;
            max-width: 80%;
        }
    </style>
</head>
<body>
    <div id="ar-container">
        <a-scene 
            id="scene" 
            mindar-image="imageTargetSrc: ./targets21.mind; 
                         uiLoading: no; 
                         uiScanning: no; 
                         uiError: no; 
                         autoStart: false;
            filterMinCF: 0.0005;
                 filterBeta: 0.05;
                 maxTrackFPS: 30;"
            color-space="sRGB" 
            renderer="colorManagement: true; physicallyCorrectLights: true"
            vr-mode-ui="enabled: false"
            device-orientation-permission-ui="enabled: false"
            embedded>
             
            <a-assets>
                <a-asset-item id="model1" src="./models/model1_Lotok_gluhoy50.glb?v=1"></a-asset-item>
            </a-assets>

            <!-- Lighting Setup -->
            <a-light type="ambient" color="#FFF" intensity="2.5"></a-light>
            <a-light type="directional" color="#FFF" intensity="2" position="2 5 3"></a-light>
            <a-light type="directional" color="#fff" intensity="1" position="-3 2 -2"></a-light>
            <a-light type="directional" color="#fff" intensity="1" position="0 3 -4"></a-light>

            <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

            <!-- Models -->
            <a-entity mindar-image-target="targetIndex: 0">
                <a-gltf-model src="#model1" position="0 0 0" scale="1.0 1.0 1.0" rotation="180 0 0"></a-gltf-model>
            </a-entity>
        </a-scene>
    </div>
    
    <div class="status" id="status">Наведите камеру на маркер</div>
    <div class="loading" id="loading">Загрузка AR...</div>
    <div class="marker-info" id="markerInfo"></div>

    <script>
        // Global variables
        let currentModel = null;
        let isModelDetached = false;
        const ROTATION_AMOUNT = 15; // degrees per click

        // Auto-play animation component
        AFRAME.registerComponent('auto-play-animation', {
            init: function() {
                this.el.addEventListener('model-loaded', () => {
                    console.log('Model loaded, starting animation');
                    const mixer = this.el.components['animation-mixer'];
                    if (mixer) {
                        console.log('Animation mixer found');
                    } else {
                        console.log('Animation mixer NOT found');
                    }
                });
            }
        });

        // Detachment functionality
        function detachModelFromMarker(marker) {
            const model = marker.querySelector('a-gltf-model');
            if (!model) return null;

            // Get world position and rotation
            const worldPos = new THREE.Vector3();
            const worldRot = new THREE.Quaternion();
            model.object3D.getWorldPosition(worldPos);
            model.object3D.getWorldQuaternion(worldRot);

            // Create a new entity for the detached model
            const detachedModel = document.createElement('a-entity');
            detachedModel.setAttribute('gltf-model', model.getAttribute('gltf-model'));
            detachedModel.setAttribute('scale', model.getAttribute('scale'));
            detachedModel.setAttribute('rotation', model.getAttribute('rotation'));
            detachedModel.setAttribute('position', {
                x: worldPos.x,
                y: worldPos.y, 
                z: worldPos.z
            });
            
            // Copy the rotation
            const rotation = model.getAttribute('rotation');
            detachedModel.setAttribute('rotation', rotation);

            // Add to scene
            document.querySelector('a-scene').appendChild(detachedModel);

            // Remove original model from marker
            marker.removeChild(model);

            return detachedModel;
        }

        // Function to setup gestures for detached model
        function setupGestureControlsForDetachedModel(detachedModel) {
            const arContainer = document.getElementById('ar-container');
            const hammerManager = new Hammer.Manager(arContainer);

            // Remove existing hammer managers if any
            hammerManager.destroy();

            // Create new gestures
            const Pan = new Hammer.Pan({ threshold: 0, pointers: 1 });
            const Pinch = new Hammer.Pinch({ threshold: 0 });
            
            hammerManager.add(Pan);
            hammerManager.add(Pinch);

            let lastPanPosition = { x: 0, y: 0 };
            let lastScale = 1;

            // Pan for rotation
            hammerManager.on('panstart panmove', function(event) {
                if (!detachedModel) return;

                const rotation = detachedModel.getAttribute('rotation');

                if (event.type === 'panstart') {
                    lastPanPosition.x = event.center.x;
                    lastPanPosition.y = event.center.y;
                } else if (event.type === 'panmove') {
                    const deltaX = event.center.x - lastPanPosition.x;
                    const deltaY = event.center.y - lastPanPosition.y;

                    rotation.y += deltaX * 0.5;
                    rotation.x += deltaY * 0.5;

                    detachedModel.setAttribute('rotation', rotation);

                    lastPanPosition.x = event.center.x;
                    lastPanPosition.y = event.center.y;
                }
            });

            // Pinch for scale
            hammerManager.on('pinchstart pinchmove', function(event) {
                if (!detachedModel) return;

                let scale = detachedModel.getAttribute('scale');

                if (event.type === 'pinchstart') {
                    lastScale = event.scale;
                } else if (event.type === 'pinchmove') {
                    const scaleFactor = event.scale / lastScale;

                    scale.x *= scaleFactor;
                    scale.y *= scaleFactor;
                    scale.z *= scaleFactor;

                    // Optional: Add scale limits
                    scale.x = Math.max(0.1, Math.min(5, scale.x));
                    scale.y = Math.max(0.1, Math.min(5, scale.y));
                    scale.z = Math.max(0.1, Math.min(5, scale.z));

                    detachedModel.setAttribute('scale', scale);
                    lastScale = event.scale;
                }
            });
        }

        // Main initialization
        document.addEventListener('DOMContentLoaded', function() {
            const status = document.getElementById('status');
            const loading = document.getElementById('loading');
            const sceneEl = document.querySelector('a-scene');

            // First request camera permission only
            async function initAR() {
                try {
                    loading.style.display = 'block';
                    status.textContent = 'Requesting camera access...';
                    
                    // Request camera access first
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    
                    // Stop the camera stream (MindAR will restart it)
                    stream.getTracks().forEach(track => track.stop());
                    
                    // Now start AR
                    startAR();
                } catch (error) {
                    console.error('Camera permission error:', error);
                    status.textContent = 'Please allow camera access for AR';
                    loading.style.display = 'none';
                }
            }
            
            function startAR() {
                status.textContent = 'Loading AR...';
                
                // Get the AR system
                const arSystem = sceneEl.systems["mindar-image-system"];
                
                // Event handlers
                sceneEl.addEventListener('arReady', function() {
                    status.textContent = 'Наведите камеру на маркер';
                    loading.style.display = 'none';
                });
                
                sceneEl.addEventListener('arError', function(evt) {
                    console.error('AR Error:', evt.detail);
                    status.textContent = 'Обновите страницу или отсканируйте Qr-код заново';
                    loading.style.display = 'none';
                });
                
                // Start AR system
                arSystem.start();
                
                // Handle marker detection
                const markers = document.querySelectorAll('[mindar-image-target]');
                
                markers.forEach((marker, index) => {
                    marker.addEventListener('targetFound', function() {
                        status.textContent = 'Маркер ' + index + ' обнаружен';
                        
                        if (!isModelDetached) {
                            // Small delay to ensure model is properly positioned
                            setTimeout(() => {
                                const detachedModel = detachModelFromMarker(marker);
                                if (detachedModel) {
                                    currentModel = detachedModel;
                                    isModelDetached = true;
                                    status.textContent = 'Модель зафиксирована на экране';
                                    
                                    // Update gesture controls to use the detached model
                                    setupGestureControlsForDetachedModel(detachedModel);
                                }
                            }, 100);
                        }
                    });
                    
                    marker.addEventListener('targetLost', function() {
                        if (!isModelDetached) {
                            status.textContent = 'Point camera at marker';
                        }
                    });
                });
            }

            // Start the initialization process
            setTimeout(initAR, 500);
            
            // Handle window resize
            window.addEventListener('resize', function() {
                if (sceneEl.renderer) {
                    sceneEl.renderer.setSize(window.innerWidth, window.innerHeight);
                }
            });
        });

        // Initial gesture controls (for before detachment)
        document.querySelector('a-scene').addEventListener('loaded', function() {
            const arContainer = document.getElementById('ar-container');
            
            // Initialize Hammer.js on the AR container
            const hammerManager = new Hammer.Manager(arContainer);

            // Create and configure the pan gesture for rotation
            const Pan = new Hammer.Pan({ threshold: 0, pointers: 1 });
            hammerManager.add(Pan);

            // Create and configure the pinch gesture for scaling
            const Pinch = new Hammer.Pinch({ threshold: 0 });
            hammerManager.add(Pinch);

            // Variables to track the last state
            let lastPanPosition = { x: 0, y: 0 };
            let lastScale = 1;

            // Handle the pan gesture to rotate the model
            hammerManager.on('panstart panmove', function(event) {
                if (!currentModel) return;

                // Get the current rotation
                const rotation = currentModel.getAttribute('rotation');

                if (event.type === 'panstart') {
                    lastPanPosition.x = event.center.x;
                    lastPanPosition.y = event.center.y;
                } else if (event.type === 'panmove') {
                    // Calculate the change in position
                    const deltaX = event.center.x - lastPanPosition.x;
                    const deltaY = event.center.y - lastPanPosition.y;

                    // Update the rotation (adjust the divisor to change sensitivity)
                    rotation.y += deltaX * 0.5;
                    rotation.x += deltaY * 0.5;

                    // Apply the new rotation
                    currentModel.setAttribute('rotation', rotation);

                    // Update the last position
                    lastPanPosition.x = event.center.x;
                    lastPanPosition.y = event.center.y;
                }
            });

            // Handle the pinch gesture to scale the model
            hammerManager.on('pinchstart pinchmove', function(event) {
                if (!currentModel) return;

                // Get the current scale
                let scale = currentModel.getAttribute('scale');

                if (event.type === 'pinchstart') {
                    lastScale = event.scale;
                } else if (event.type === 'pinchmove') {
                    // Calculate the scale factor
                    const scaleFactor = event.scale / lastScale;

                    // Update the scale uniformly
                    scale.x *= scaleFactor;
                    scale.y *= scaleFactor;
                    scale.z *= scaleFactor;

                    // Apply the new scale
                    currentModel.setAttribute('scale', scale);

                    // Update the last scale
                    lastScale = event.scale;
                }
            });
        });
    </script>
</body>
</html>
