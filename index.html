<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR with Rotation Controls</title>
    <script src="./aframe.min.js"></script>
    <script src="./mindar-image-aframe.prod.js"></script>
    <script src="./hammer.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; width: 100vw; height: 100vh; }
        #ar-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
        .status { 
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%); 
            color: #fff; background: rgba(0, 0, 0, 0.3); padding: 10px 20px; 
            border-radius: 20px; font-family: Arial; z-index: 1000; 
        }
    </style>
</head>
<body>
    <div id="ar-container">
        <a-scene 
            mindar-image="imageTargetSrc: ./targets21.mind; 
                         uiLoading: no; uiScanning: no; uiError: no; 
                         autoStart: false;"
            embedded>
             
            <a-assets>
                <a-asset-item id="model1" src="./models/model1_Lotok_gluhoy50.glb?v=1"></a-asset-item>
            </a-assets>

            <a-light type="ambient" color="#FFF" intensity="2.5"></a-light>
            <a-light type="directional" color="#FFF" intensity="2" position="2 5 3"></a-light>

            <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

            <!-- This is the model that gets detected and will be replaced -->
            <a-entity mindar-image-target="targetIndex: 0">
                <a-gltf-model src="#model1" position="0 0 0" scale="1 1 1" rotation="180 0 0"></a-gltf-model>
            </a-entity>

            <!-- This is where our persistent model will be placed -->
            <a-entity id="persistent-model-container"></a-entity>
        </a-scene>
    </div>
    
    <div class="status" id="status">Point camera at marker</div>

    <script>
        let currentModel = null;
        let modelDetached = false;
        let hammer = null;

        document.addEventListener('DOMContentLoaded', function() {
            const status = document.getElementById('status');
            const scene = document.querySelector('a-scene');
            
            // Initialize gesture controls
            function initGestures() {
                const container = document.getElementById('ar-container');
                hammer = new Hammer(container);
                
                hammer.get('pan').set({ direction: Hammer.DIRECTION_ALL });
                hammer.get('pinch').set({ enable: true });

                hammer.on('pan', function(e) {
                    if (!currentModel) return;
                    const rotation = currentModel.getAttribute('rotation');
                    rotation.y += e.deltaX * 0.5;
                    currentModel.setAttribute('rotation', rotation);
                });

                hammer.on('pinch', function(e) {
                    if (!currentModel) return;
                    let scale = currentModel.getAttribute('scale');
                    const newScale = Math.max(0.1, Math.min(3, e.scale));
                    currentModel.setAttribute('scale', {x: newScale, y: newScale, z: newScale});
                });
            }

            // Simple detachment function
            function detachModel() {
    const marker = document.querySelector('[mindar-image-target]');
    const originalModel = marker.querySelector('a-gltf-model');

    if (!originalModel) return null;

    const persistentContainer = document.getElementById('persistent-model-container');

    // создаём новый объект
    const newModel = document.createElement('a-entity');
    newModel.setAttribute('gltf-model', '#model1');
    newModel.setAttribute('scale', '1 1 1');
    newModel.setAttribute('rotation', '180 0 0');

    // ждём пока оригинал реально загрузится в three.js
    originalModel.object3D.updateMatrixWorld(true);

    // копируем позицию, вращение и масштаб напрямую из object3D
    const pos = new THREE.Vector3();
    const rot = new THREE.Euler();
    const scale = new THREE.Vector3();

    originalModel.object3D.getWorldPosition(pos);
    originalModel.object3D.getWorldScale(scale);
    originalModel.object3D.getWorldQuaternion(rot);

    // присваиваем напрямую в three.js объект нового энтити
    newModel.addEventListener('model-loaded', () => {
        newModel.object3D.position.copy(pos);
        newModel.object3D.quaternion.copy(rot);
        newModel.object3D.scale.copy(scale);
    });

    persistentContainer.appendChild(newModel);

    // просто скрываем оригинал (чтобы не мигал)
    originalModel.setAttribute('visible', 'false');

    return newModel;
}
            // Start AR
            async function startAR() {
                try {
                    status.textContent = 'Starting camera...';
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    stream.getTracks().forEach(track => track.stop());
                    
                    const arSystem = scene.systems["mindar-image-system"];
                    
                    scene.addEventListener('arReady', () => {
                        status.textContent = 'Point camera at marker';
                    });
                    
                    // Handle marker detection
                    const marker = document.querySelector('[mindar-image-target]');
                    marker.addEventListener('targetFound', () => {
                        if (!modelDetached) {
                            status.textContent = 'Marker detected - detaching model';
                            
                            setTimeout(() => {
                                currentModel = detachModel();
                                if (currentModel) {
                                    modelDetached = true;
                                    status.textContent = 'Model detached - use gestures to rotate/scale';
                                    initGestures();
                                }
                            }, 100);
                        } else {
                            status.textContent = 'Model already detached';
                        }
                    });

                    arSystem.start();
                    
                } catch (error) {
                    status.textContent = 'Camera access denied - please allow camera';
                    console.error(error);
                }
            }

            // Start everything when scene is loaded
            scene.addEventListener('loaded', function() {
                setTimeout(startAR, 1000);
            });
        });
    </script>
</body>
</html>
