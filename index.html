<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR - Persistent Model</title>
    <script src="./aframe.min.js"></script>
    <script src="./mindar-image-aframe.prod.js"></script>
    <script src="./hammer.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; }
        #ar-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
        .status { 
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%); 
            color: #fff; background: rgba(0, 0, 0, 0.6); padding: 10px 20px; 
            border-radius: 20px; font-family: Arial; z-index: 1000; 
        }
    </style>
</head>
<body>
    <div id="ar-container">
        <a-scene
            mindar-image="imageTargetSrc: ./targets21.mind; 
                         autoStart: false; uiLoading: no; uiScanning: no;"
            embedded
            color-space="sRGB"
            renderer="colorManagement: true, physicallyCorrectLights"
        >
            <a-assets>
                <a-asset-item id="model1" src="./models/model1_Lotok_gluhoy50.glb?v=1"></a-asset-item>
            </a-assets>

            <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
            
            <!-- Lighting -->
            <a-light type="ambient" color="#FFF" intensity="2.5"></a-light>
            <a-light type="directional" color="#FFF" intensity="2" position="2 5 3"></a-light>

            <!-- Marker with original model (will be hidden after detachment) -->
            <a-entity mindar-image-target="targetIndex: 0" id="marker">
                <a-entity id="spawn-model" gltf-model="#model1" 
                         position="0 0 0" scale="1 1 1" rotation="180 0 0"
                         visible="false">
                </a-entity>
            </a-entity>

        </a-scene>
    </div>
    
    <div class="status" id="status">Point camera at marker</div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const status = document.getElementById('status');
            const scene = document.querySelector('a-scene');
            const marker = document.querySelector('#marker');
            const spawnModel = document.querySelector('#spawn-model');
            
            let detachedModel = null;
            let hammerManager = null;

            // Initialize gesture controls for detached model
            function initGestures(model) {
                const container = document.getElementById('ar-container');
                
                if (hammerManager) {
                    hammerManager.destroy();
                }

                hammerManager = new Hammer.Manager(container);
                
                // Pan for rotation
                const pan = new Hammer.Pan({ direction: Hammer.DIRECTION_ALL });
                // Pinch for scale  
                const pinch = new Hammer.Pinch();
                
                hammerManager.add(pan);
                hammerManager.add(pinch);

                let lastScale = 1;

                hammerManager.on('pan', function(e) {
                    const rotation = model.getAttribute('rotation');
                    rotation.y += e.deltaX * 0.5;
                    rotation.x += e.deltaY * 0.5;
                    model.setAttribute('rotation', rotation);
                });

                hammerManager.on('pinch', function(e) {
                    let scale = model.getAttribute('scale');
                    const scaleFactor = e.scale / lastScale;
                    
                    scale.x *= scaleFactor;
                    scale.y *= scaleFactor;
                    scale.z *= scaleFactor;
                    
                    // Limit scale
                   
                    
                    model.setAttribute('scale', scale);
                    lastScale = e.scale;
                });

                console.log("Gesture controls initialized for detached model");
            }

            // Marker detection handler
            marker.addEventListener('targetFound', () => {
                console.log('📍 Marker found');
                status.textContent = 'Marker detected';
                
                if (detachedModel) {
                    status.textContent = 'Model already detached';
                    return; // Уже отвязан
                }

                // Даём время MindAR правильно позиционировать модель
                setTimeout(() => {
                    // Получаем мировую позицию и поворот из marker
                    const worldPos = new THREE.Vector3();
                    const worldQuat = new THREE.Quaternion();
                    marker.object3D.getWorldPosition(worldPos);
                    marker.object3D.getWorldQuaternion(worldQuat);

                    // Создаём новый объект вне маркера
                    detachedModel = document.createElement('a-entity');
                    detachedModel.setAttribute('gltf-model', '#model1');
                    detachedModel.setAttribute('scale', '1 1 1');
                    
                    // Устанавливаем мировые координаты
                    detachedModel.object3D.position.copy(worldPos);
                    detachedModel.object3D.quaternion.copy(worldQuat);

                    // Добавляем напрямую в сцену
                    scene.appendChild(detachedModel);

                    // Скрываем оригинал (чтобы не моргал)
                    spawnModel.setAttribute('visible', false);

                    // Инициализируем жесты для новой модели
                    initGestures(detachedModel);

                    status.textContent = 'Model detached - use gestures to rotate/scale';
                    console.log('✅ Model detached and persistent');
                }, 300);
            });

            marker.addEventListener('targetLost', () => {
                console.log('❌ Marker lost (model stays)');
                if (!detachedModel) {
                    status.textContent = 'Point camera at marker';
                }
            });

            // Start AR
            async function startAR() {
                try {
                    status.textContent = 'Starting camera...';
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    stream.getTracks().forEach(track => track.stop());
                    
                    const arSystem = scene.systems["mindar-image-system"];
                    
                    scene.addEventListener('arReady', () => {
                        status.textContent = 'Point camera at marker';
                    });

                    arSystem.start();
                    
                } catch (error) {
                    status.textContent = 'Camera access denied - please allow camera';
                    console.error(error);
                }
            }

            // Start when scene is loaded
            scene.addEventListener('loaded', () => {
                setTimeout(startAR, 1000);
            });
        });
    </script>
</body>
</html>
